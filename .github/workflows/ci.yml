name: ci

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: Optional mocha spec file/pattern to run instead of the full suite
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      matrix:
        name:
        - Node.js 0.10
        - Node.js 0.12
        - io.js 1.x
        - io.js 2.x
        - io.js 3.x
        - Node.js 4.x
        - Node.js 5.x
        - Node.js 6.x
        - Node.js 7.x
        - Node.js 8.x
        - Node.js 9.x
        - Node.js 10.x
        - Node.js 11.x
        - Node.js 12.x
        - Node.js 13.x
        - Node.js 14.x
        - Node.js 15.x
        - Node.js 16.x

        include:
        - name: Node.js 0.10
          node-version: "0.10"
          npm-i: mocha@3.5.3 nyc@10.3.2
          npm-rm: beautify-benchmark benchmark

        - name: Node.js 0.12
          node-version: "0.12"
          npm-i: mocha@3.5.3 nyc@10.3.2
          npm-rm: beautify-benchmark benchmark

        - name: io.js 1.x
          node-version: "1.8"
          npm-i: mocha@3.5.3 nyc@10.3.2
          npm-rm: beautify-benchmark benchmark

        - name: io.js 2.x
          node-version: "2.5"
          npm-i: mocha@3.5.3 nyc@10.3.2
          npm-rm: beautify-benchmark benchmark

        - name: io.js 3.x
          node-version: "3.3"
          npm-i: mocha@3.5.3 nyc@10.3.2
          npm-rm: beautify-benchmark benchmark

        - name: Node.js 4.x
          node-version: "4.9"
          npm-i: mocha@5.2.0 nyc@11.9.0
          npm-rm: beautify-benchmark benchmark

        - name: Node.js 5.x
          node-version: "5.12"
          npm-i: mocha@5.2.0 nyc@11.9.0
          npm-rm: beautify-benchmark benchmark

        - name: Node.js 6.x
          node-version: "6.17"
          npm-i: mocha@6.2.2 nyc@14.1.1
          npm-rm: beautify-benchmark benchmark

        - name: Node.js 7.x
          node-version: "7.10"
          npm-i: mocha@6.2.2 nyc@14.1.1
          npm-rm: beautify-benchmark benchmark

        - name: Node.js 8.x
          node-version: "8.17"
          npm-i: mocha@7.2.0
          npm-rm: beautify-benchmark benchmark

        - name: Node.js 9.x
          node-version: "9.11"
          npm-i: mocha@7.2.0
          npm-rm: beautify-benchmark benchmark

        - name: Node.js 10.x
          node-version: "10.24"
          npm-rm: beautify-benchmark benchmark

        - name: Node.js 11.x
          node-version: "11.15"
          npm-rm: beautify-benchmark benchmark

        - name: Node.js 12.x
          node-version: "12.22"
          npm-rm: beautify-benchmark benchmark

        - name: Node.js 13.x
          node-version: "13.14"
          npm-rm: beautify-benchmark benchmark

        - name: Node.js 14.x
          node-version: "14.17"
          npm-rm: beautify-benchmark benchmark

        - name: Node.js 15.x
          node-version: "15.14"
          npm-rm: beautify-benchmark benchmark

        - name: Node.js 16.x
          node-version: "16.2"
          npm-rm: beautify-benchmark benchmark

    steps:
    - uses: actions/checkout@v4

    - name: Install Node.js ${{ matrix.node-version }}
      shell: bash -eo pipefail -l {0}
      run: |
        nvm install --default ${{ matrix.node-version }}
        if [[ "${{ matrix.node-version }}" == 0.* ]]; then
          npm config set strict-ssl false
        fi
        dirname "$(nvm which ${{ matrix.node-version }})" >> "$GITHUB_PATH"

    - name: Configure npm
      shell: bash
      run: |
        npm config set shrinkwrap false
        # nyc@15.1.0's transitive dependencies now resolve to 2026-era releases that
        # use optional catch binding (`catch {`), which Node.js 8/9 cannot parse.
        # Pinning those two legs to the seal time machine at this package's release
        # date restores the 2021-era resolution that was green back then.
        NODE_MAJOR="$(cut -d. -f1 <<< "${{ matrix.node-version }}")"
        if [[ "$NODE_MAJOR" == "8" || "$NODE_MAJOR" == "9" ]]; then
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2021-06-01T00:57:28.507000Z
        fi

    - name: Remove npm module(s) ${{ matrix.npm-rm }}
      run: npm rm --silent --save-dev ${{ matrix.npm-rm }}
      if: matrix.npm-rm != ''

    - name: Install npm module(s) ${{ matrix.npm-i }}
      run: npm install --save-dev ${{ matrix.npm-i }}
      if: matrix.npm-i != ''

    - name: Setup Node.js version-specific dependencies
      shell: bash
      run: |
        # eslint for linting
        # - remove on Node.js < 10
        if [[ "$(cut -d. -f1 <<< "${{ matrix.node-version }}")" -lt 10 ]]; then
          node -pe 'Object.keys(require("./package").devDependencies).join("\n")' | \
            grep -E '^eslint(-|$)' | \
            sort -r | \
            xargs -n1 npm rm --silent --save-dev
        fi

    - name: Install Node.js dependencies
      run: npm install

    - name: List environment
      id: list_env
      shell: bash
      run: |
        echo "node@$(node -v)"
        echo "npm@$(npm -v)"
        npm -s ls ||:
        (npm -s ls --depth=0 ||:) | awk -F'[ @]' 'NR>1 && $2 { print "::set-output name=" $2 "::" $3 }'

    - name: Run tests
      shell: bash
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          node_modules/.bin/mocha --reporter spec --bail --check-leaks ${{ inputs.test-filter }}
        elif npm -ps ls nyc | grep -q nyc; then
          npm run test-ci
        else
          npm test
        fi

  pack:
    name: Pack npm tarball
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: Install Node.js 14.15.4
      shell: bash -eo pipefail -l {0}
      run: |
        nvm install --default 14.15.4
        dirname "$(nvm which 14.15.4)" >> "$GITHUB_PATH"

    - name: Install npm 6.14.10
      run: npm install -g npm@6.14.10

    - name: List environment
      shell: bash
      run: |
        echo "node@$(node -v)"
        echo "npm@$(npm -v)"

    - name: Pack package tarball
      run: npm pack

    - name: Upload package tarball
      uses: actions/upload-artifact@v4
      with:
        name: npm-tarball
        path: proxy-addr-*.tgz
        if-no-files-found: error
